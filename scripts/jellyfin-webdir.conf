# Serve the custom jellyfin-web build instead of the apt-packaged client.
#
# Install BOTH files:
#   /etc/systemd/system/jellyfin.service.d/webdir.conf   <- this file
#   /etc/default/jellyfin-webdir                         <- jellyfin-webdir.env
# then: sudo systemctl daemon-reload && sudo systemctl restart jellyfin
#
# WHY AN EnvironmentFile AND NOT Environment=:
# The packaged unit does `EnvironmentFile=/etc/default/jellyfin`, which sets
# JELLYFIN_WEB_OPT to the packaged web root. Per man systemd.exec, "Settings
# from these files override settings made with Environment=" -- so a drop-in
# using Environment= is silently overridden by /etc/default/jellyfin no matter
# what order the drop-ins load in. Multiple EnvironmentFile= entries, however,
# are "read in the order they are specified and the later setting will override
# the earlier setting", and drop-ins are parsed after the main unit. So a second
# EnvironmentFile listed here wins.
#
# This avoids editing /etc/default/jellyfin itself, which is a dpkg conffile --
# modifying it would trigger a merge prompt on every jellyfin-server upgrade.
#
# Jellyfin runs as the slickwarren user here (User= in jellyfin.service.conf), so
# the web root lives in that user's home and needs no root to update.
#
# To revert to the packaged client: delete this file, daemon-reload, restart.

[Service]
EnvironmentFile=/etc/default/jellyfin-webdir
